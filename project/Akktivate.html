  <style>
/* Akktivate — Design Tokens */
:root {
  --bg: #08090B;
  --bg-elev: #0E1014;
  --surface: #14171C;
  --surface-2: #1C2027;
  --surface-3: #252A33;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.14);

  --orange: #FF4D1A;
  --orange-bright: #FF6E3D;
  --orange-deep: #C8350C;
  --orange-soft: rgba(255, 77, 26, 0.14);

  --green: #C6FF3D;
  --green-bright: #DBFF6E;
  --green-soft: rgba(198, 255, 61, 0.14);

  --text: #FFFFFF;
  --text-dim: #9AA0AB;
  --text-faint: #5C6270;

  --radius-sm: 10px;
  --radius: 18px;
  --radius-lg: 28px;

  --shadow-glow-orange: 0 8px 32px rgba(255, 77, 26, 0.35);
  --shadow-glow-green: 0 6px 24px rgba(198, 255, 61, 0.25);

  --display: "Anton", "Bebas Neue", Impact, sans-serif;
  --body: "Space Grotesk", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #050608; color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255, 77, 26, 0.08), transparent 70%),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(198, 255, 61, 0.05), transparent 70%),
    #050608;
}

/* ---------- App shell ---------- */
.app-root {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-top: 54px; /* status bar */
  padding-bottom: 130px; /* tab bar + home indicator */
  position: relative;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
.hide-scroll::-webkit-scrollbar { display: none; }

.screen-pad { padding: 0 20px; }

/* ---------- Typography ---------- */
.h-display { font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; text-transform: uppercase; line-height: 0.9; }
.h-title { font-family: var(--body); font-weight: 700; letter-spacing: -0.01em; }
.label { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
.metric { font-family: var(--display); font-weight: 400; font-feature-settings: "tnum"; line-height: 0.9; }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; white-space: nowrap; }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  position: relative;
  overflow: hidden;
}
.card-2 {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

/* ---------- Buttons ---------- */
.btn {
  border: none;
  background: transparent;
  color: inherit;
  font-family: var(--body);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  transition: transform 120ms ease, opacity 120ms ease, background 200ms ease;
  user-select: none;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }

.btn-primary {
  background: var(--orange);
  color: #0A0507;
  height: 56px;
  padding: 0 24px;
  border-radius: 16px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 15px;
  white-space: nowrap;
  box-shadow: var(--shadow-glow-orange);
  position: relative;
  overflow: hidden;
}
.btn-primary::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 45%);
  pointer-events: none;
}

.btn-ghost {
  background: var(--surface-2);
  color: var(--text);
  height: 44px;
  padding: 0 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
}

.btn-chip {
  height: 36px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text-dim);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
}
.btn-chip.is-active {
  background: var(--orange-soft);
  color: var(--orange-bright);
  border-color: rgba(255, 77, 26, 0.4);
}
.btn-chip.is-active-green {
  background: var(--green-soft);
  color: var(--green-bright);
  border-color: rgba(198, 255, 61, 0.4);
}

/* ---------- Progress ---------- */
.progress-track {
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--orange-deep), var(--orange), var(--orange-bright));
  border-radius: 99px;
  position: relative;
  transition: width 600ms cubic-bezier(0.2, 0.9, 0.3, 1);
}
.progress-fill::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  background-size: 200% 100%;
  animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ---------- Tab bar ---------- */
.tabbar {
  position: absolute;
  left: 12px; right: 12px;
  bottom: 18px;
  height: 72px;
  z-index: 40;
  background: rgba(14, 16, 20, 0.96);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--line-strong);
  border-radius: 28px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}
.tabbar button {
  background: transparent; border: 0; cursor: pointer;
  height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  color: var(--text-faint);
  font-family: var(--body); font-weight: 600; font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase;
  position: relative;
  transition: color 180ms ease;
}
.tabbar button.active { color: var(--orange-bright); }
.tabbar button.active::before {
  content: "";
  position: absolute; top: 8px;
  width: 28px; height: 3px; border-radius: 2px;
  background: var(--orange);
  box-shadow: 0 0 12px var(--orange);
}

/* ---------- Tile / stat ---------- */
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.stat .stat-icon {
  position: absolute; top: 14px; right: 14px;
  opacity: 0.85;
}

/* ---------- Badge / Chip ---------- */
.kbd {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 600;
}

/* ---------- Achievement medals ---------- */
.medal {
  aspect-ratio: 1 / 1;
  border-radius: 18px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 8px;
}
.medal.locked { opacity: 0.32; filter: grayscale(0.9); }
.medal.unlocked::before {
  content: "";
  position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(255,77,26,0.18), transparent 60%);
  pointer-events: none;
}

/* ---------- Map ---------- */
.map-bg {
  background:
    radial-gradient(circle at 30% 30%, rgba(255,77,26,0.06), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(198,255,61,0.05), transparent 50%),
    #0B0D11;
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
}

/* ---------- Animations ---------- */
@keyframes pulseGlow {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.18); }
}
.pulse-dot { animation: pulseGlow 1.8s ease-in-out infinite; }

@keyframes drawLine {
  to { stroke-dashoffset: 0; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.slide-up { animation: slideUp 380ms cubic-bezier(0.2, 0.9, 0.3, 1) both; }

@keyframes screenIn {
  from { transform: translateY(8px); }
  to { transform: translateY(0); }
}
.screen-in { animation: screenIn 260ms cubic-bezier(0.2, 0.9, 0.3, 1); }

@keyframes ringRotate {
  to { transform: rotate(360deg); }
}

@keyframes countUp {
  from { transform: translateY(8px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Hide selection box on touchable */
button, .tap { -webkit-tap-highlight-color: transparent; }

/* Streak flame */
.flame {
  background: linear-gradient(180deg, var(--orange-bright), var(--orange-deep));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Number stripes */
.stripes {
  background-image: repeating-linear-gradient(
    -45deg,
    rgba(255,77,26,0.10) 0,
    rgba(255,77,26,0.10) 4px,
    transparent 4px,
    transparent 10px
  );
}

// tools.js — Free public APIs callable directly from the browser (no key, CORS-friendly)
window.AKK_TOOLS = (() => {
  // ── Browser geolocation ──────────────────────────────────────
  function getPosition(opts = {}) {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Geolocation no soportado'));
      navigator.geolocation.getCurrentPosition(
        p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy }),
        e => reject(e),
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000, ...opts }
      );
    });
  }

  // ── Forward geocoding via Nominatim ──────────────────────────
  async function forwardGeocode(query) {
    const q = encodeURIComponent(query.trim());
    const url = `https://nominatim.openstreetmap.org/search?q=${q}&format=jsonv2&limit=5&addressdetails=1&accept-language=es`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('Nominatim error');
    const arr = await r.json();
    return arr.map(it => {
      const a = it.address || {};
      const city = a.city || a.town || a.village || a.municipality || a.county || '';
      const district = a.suburb || a.neighbourhood || a.city_district || '';
      return {
        lat: parseFloat(it.lat), lng: parseFloat(it.lon),
        label: district && city ? `${city} · ${district}` : (city || it.display_name.split(',').slice(0,2).join(',')),
        full: it.display_name, city, district,
      };
    });
  }

  // ── Reverse geocoding via OSM Nominatim ──────────────────────
  async function reverseGeocode(lat, lng) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=14&accept-language=es`;
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('Nominatim error');
    const j = await r.json();
    const a = j.address || {};
    const city = a.city || a.town || a.village || a.municipality || a.county || '';
    const district = a.suburb || a.neighbourhood || a.city_district || '';
    return {
      city, district,
      label: district && city ? `${city} · ${district}` : (city || j.display_name?.split(',').slice(0,2).join(',')),
      country: a.country || '',
      raw: j,
    };
  }

  // ── Open-Meteo: weather (free, no key, CORS) ─────────────────
  async function getWeather(lat, lng) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m` +
      `&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,uv_index_max` +
      `&timezone=auto&forecast_days=3`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Open-Meteo error');
    return r.json();
  }

  // ── Open-Elevation: terrain elevation (free, no key) ─────────
  async function getElevation(points /* [{lat,lng}] */) {
    const locations = points.map(p => `${p.lat},${p.lng}`).join('|');
    const url = `https://api.open-elevation.com/api/v1/lookup?locations=${locations}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('Open-Elevation error');
    const j = await r.json();
    return j.results || [];
  }

  // ── Weather code → human label (es) ──────────────────────────
  const WMO = {
    0: 'Despejado', 1: 'Poco nublado', 2: 'Parcialmente nublado', 3: 'Nublado',
    45: 'Niebla', 48: 'Niebla con escarcha',
    51: 'Llovizna débil', 53: 'Llovizna', 55: 'Llovizna intensa',
    61: 'Lluvia débil', 63: 'Lluvia', 65: 'Lluvia fuerte',
    71: 'Nieve débil', 73: 'Nieve', 75: 'Nieve fuerte',
    77: 'Granos de nieve',
    80: 'Chubascos', 81: 'Chubascos fuertes', 82: 'Chubascos violentos',
    85: 'Chubascos de nieve', 86: 'Chubascos de nieve fuertes',
    95: 'Tormenta', 96: 'Tormenta con granizo débil', 99: 'Tormenta con granizo',
  };

  function describeWMO(code) { return WMO[code] || 'Condiciones variables'; }

  function weatherIcon(code, isDay = 1) {
    if ([0].includes(code)) return isDay ? '☀' : '🌙';
    if ([1, 2].includes(code)) return isDay ? '⛅' : '☁';
    if ([3].includes(code)) return '☁';
    if ([45, 48].includes(code)) return '🌫';
    if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return '🌧';
    if ([71, 73, 75, 77, 85, 86].includes(code)) return '❄';
    if ([95, 96, 99].includes(code)) return '⛈';
    return '🌤';
  }

  // Running condition advisor (composite)
  function runningCondition(w) {
    if (!w?.current) return { score: 0, label: 'Sin datos' };
    const t = w.current.temperature_2m;
    const wind = w.current.wind_speed_10m;
    const prec = w.current.precipitation;
    const code = w.current.weather_code;
    let score = 100;
    if (t < 0 || t > 32) score -= 40;
    else if (t < 5 || t > 28) score -= 20;
    else if (t < 8 || t > 24) score -= 8;
    if (wind > 35) score -= 30;
    else if (wind > 22) score -= 15;
    if (prec > 2) score -= 30;
    else if (prec > 0.2) score -= 10;
    if ([61,63,65,80,81,82,95,96,99].includes(code)) score -= 20;
    if ([71,73,75,77,85,86].includes(code)) score -= 15;
    score = Math.max(0, Math.min(100, score));
    const label = score >= 80 ? 'Excelente' : score >= 60 ? 'Buena' : score >= 40 ? 'Aceptable' : score >= 20 ? 'Mala' : 'Pésima';
    const color = score >= 80 ? '#C6FF3D' : score >= 60 ? '#A8E635' : score >= 40 ? '#FFB31A' : '#FF6E3D';
    return { score, label, color };
  }

  // Cache weather/location per session
  const cache = {};
  async function getLocationAndWeather() {
    if (cache.ready) return cache;
    try {
      const pos = await getPosition();
      cache.pos = pos;
      try { cache.geo = await reverseGeocode(pos.lat, pos.lng); } catch (e) { cache.geo = null; }
      try { cache.weather = await getWeather(pos.lat, pos.lng); } catch (e) { cache.weather = null; }
      cache.ready = true;
      cache.real = true;
    } catch (e) {
      // Fallback Madrid Retiro
      cache.pos = { lat: 40.4153, lng: -3.6843 };
      cache.geo = { city: 'Madrid', district: 'Retiro', label: 'Madrid · Retiro' };
      try { cache.weather = await getWeather(cache.pos.lat, cache.pos.lng); } catch (e) { cache.weather = null; }
      cache.ready = true;
      cache.real = false;
      cache.error = e.message || 'Sin permiso de GPS';
    }
    return cache;
  }

  function clearCache() { for (const k of Object.keys(cache)) delete cache[k]; }

  return { getPosition, reverseGeocode, forwardGeocode, getWeather, getElevation, describeWMO, weatherIcon, runningCondition, getLocationAndWeather, clearCache };
})();

  <script type="text/babel">
// ui.jsx — Shared UI primitives for Akktivate
const { useState, useEffect, useRef, useMemo } = React;
const Icon = window.Icon;

// ── ActivityChip — colored pill ────────────────────────────────
function ActivityIcon({ type, size = 18, color }) {
  const map = { run: "run", bike: "bike", trail: "trail", mtb: "mtb" };
  return <Icon name={map[type] || "run"} size={size} color={color || "currentColor"} />;
}

// ── Avatar ─────────────────────────────────────────────────────
function Avatar({ initials, color = "#FF4D1A", size = 40, border = false, imageUrl }) {
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%',
      background: imageUrl ? '#000' : `linear-gradient(135deg, ${color}, ${shade(color, -30)})`,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: 'var(--display)', fontSize: size * 0.42, color: '#0A0507',
      letterSpacing: '0.04em',
      border: border ? '2px solid var(--bg)' : 'none',
      flexShrink: 0,
      overflow: 'hidden',
      position: 'relative',
    }}>
      {imageUrl ? (
        <img src={imageUrl} alt={initials} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block' }}/>
      ) : initials}
    </div>
  );
}
function shade(hex, amt) {
  // simple darken/lighten
  const c = hex.replace('#','');
  const num = parseInt(c, 16);
  let r = (num >> 16) + amt; let g = ((num >> 8) & 0xff) + amt; let b = (num & 0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// ── ProgressBar with shimmer ───────────────────────────────────
function ProgressBar({ value, max = 100, color = "var(--orange)", height = 8 }) {
  const pct = Math.min(100, Math.max(0, (value / max) * 100));
  return (
    <div className="progress-track" style={{ height }}>
      <div className="progress-fill" style={{ width: pct + '%' }} />
    </div>
  );
}

// ── RingProgress ───────────────────────────────────────────────
function RingProgress({ value, max = 100, size = 64, stroke = 6, color = "var(--orange)", trackColor = "rgba(255,255,255,0.08)", children }) {
  const pct = Math.min(1, value / max);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={trackColor} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
          style={{ transition: 'stroke-dashoffset 800ms cubic-bezier(.2,.9,.3,1)' }}/>
      </svg>
      <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {children}
      </div>
    </div>
  );
}

// ── Stat ───────────────────────────────────────────────────────
function Stat({ icon, label, value, unit, accent = "var(--orange-bright)" }) {
  return (
    <div className="stat">
      <div className="stat-icon" style={{ color: accent }}>
        <Icon name={icon} size={18} />
      </div>
      <div className="label" style={{ marginBottom: 8 }}>{label}</div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
        <div className="metric" style={{ fontSize: 30, color: 'var(--text)' }}>{value}</div>
        {unit && <div className="mono" style={{ fontSize: 12, color: 'var(--text-dim)' }}>{unit}</div>}
      </div>
    </div>
  );
}

// ── ScreenHeader ───────────────────────────────────────────────
function ScreenHeader({ title, action, sub }) {
  return (
    <div style={{ padding: '8px 20px 16px', display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
      <div>
        {sub && <div className="label" style={{ marginBottom: 6, color: 'var(--orange-bright)' }}>{sub}</div>}
        <h1 className="h-display" style={{ margin: 0, fontSize: 38, color: 'var(--text)' }}>{title}</h1>
      </div>
      {action}
    </div>
  );
}

// ── SectionHead ────────────────────────────────────────────────
function SectionHead({ title, right }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 20px', margin: '24px 0 12px', gap: 12 }}>
      <div className="label" style={{ color: 'var(--text-dim)' }}>{title}</div>
      <div style={{ whiteSpace: 'nowrap', flexShrink: 0 }}>{right}</div>
    </div>
  );
}

// ── Bottom Tab Bar ─────────────────────────────────────────────
function TabBar({ active, onChange }) {
  const tabs = [
    { id: 'home', label: 'Inicio', icon: 'home' },
    { id: 'routes', label: 'Rutas', icon: 'route' },
    { id: 'community', label: 'Comunidad', icon: 'community' },
    { id: 'profile', label: 'Perfil', icon: 'user' },
  ];
  return (
    <nav className="tabbar">
      {tabs.map(t => (
        <button key={t.id} className={active === t.id ? 'active' : ''} onClick={() => onChange(t.id)}>
          <Icon name={t.icon} size={22} />
          <span>{t.label}</span>
        </button>
      ))}
    </nav>
  );
}

// ── Kudos button (animated) ────────────────────────────────────
function KudosButton({ count: initial, liked: initialLiked }) {
  const [liked, setLiked] = useState(initialLiked);
  const [count, setCount] = useState(initial);
  const [burst, setBurst] = useState(0);

  function toggle() {
    if (liked) { setLiked(false); setCount(c => c - 1); }
    else { setLiked(true); setCount(c => c + 1); setBurst(b => b + 1); }
  }

  return (
    <button onClick={toggle} className="btn" style={{
      gap: 6, padding: '6px 12px', borderRadius: 999,
      background: liked ? 'var(--orange-soft)' : 'var(--surface-2)',
      border: `1px solid ${liked ? 'rgba(255,77,26,0.4)' : 'var(--line)'}`,
      color: liked ? 'var(--orange-bright)' : 'var(--text-dim)',
      fontSize: 13, fontWeight: 700,
      position: 'relative',
    }}>
      <span style={{
        position: 'relative', display: 'inline-flex',
        transform: liked ? 'scale(1.15)' : 'scale(1)',
        transition: 'transform 240ms cubic-bezier(.34,1.56,.64,1)'
      }}>
        <Icon name={liked ? "heart-fill" : "heart"} size={14} />
        {burst > 0 && (
          <span key={burst} style={{
            position: 'absolute', inset: 0,
            animation: 'kudosBurst 600ms ease-out forwards',
            pointerEvents: 'none',
          }}>
            <Icon name="heart-fill" size={14} color="var(--orange-bright)"/>
          </span>
        )}
      </span>
      <span className="mono">{count}</span>
    </button>
  );
}

// Add kudosBurst keyframes
if (!document.getElementById('akk-extra-keyframes')) {
  const st = document.createElement('style');
  st.id = 'akk-extra-keyframes';
  st.textContent = `
    @keyframes kudosBurst {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes activityPing {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }
    @keyframes drift {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  `;
  document.head.appendChild(st);
}

// ── ActivityRow ────────────────────────────────────────────────
function ActivityRow({ a, compact = false }) {
  const colorMap = { run: '#FF6E3D', bike: '#5DC9F2', trail: '#C6FF3D', mtb: '#FFB31A' };
  const labelMap = { run: 'Running', bike: 'Ciclismo', trail: 'Trail', mtb: 'MTB' };
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 14, padding: '12px 0',
      borderBottom: '1px solid var(--line)',
    }}>
      <div style={{
        width: 44, height: 44, borderRadius: 14,
        background: 'var(--surface-2)',
        border: '1px solid var(--line)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: colorMap[a.type] || 'var(--orange-bright)',
        flexShrink: 0,
      }}>
        <ActivityIcon type={a.type} size={22} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontWeight: 700, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{a.title}</div>
        <div style={{ display: 'flex', gap: 10, marginTop: 2, fontSize: 11, color: 'var(--text-dim)' }}>
          <span>{labelMap[a.type]}</span>
          <span>·</span>
          <span>{a.date}</span>
        </div>
      </div>
      <div style={{ textAlign: 'right' }}>
        <div className="metric" style={{ fontSize: 20, color: 'var(--text)' }}>{a.km}<span style={{ fontSize: 11, color: 'var(--text-dim)', marginLeft: 3 }}>km</span></div>
        <div className="mono" style={{ fontSize: 11, color: 'var(--text-dim)' }}>{a.time}</div>
      </div>
    </div>
  );
}

// expose
Object.assign(window, {
  Avatar, ActivityIcon, ProgressBar, RingProgress, Stat, ScreenHeader, SectionHead,
  TabBar, KudosButton, ActivityRow,
});

// routes.jsx — Akktivate Route Generator
const { useState: useRStateRT, useEffect: useREffectRT, useMemo: useRMemoRT } = React;

// ── SVG route map — generates a route based on params ──────────
function RouteMap({ activity, distance, difficulty, animated = true, dark = true, location = 'Madrid' }) {
  // Seeded path generation
  const seed = `${activity}-${distance}-${difficulty}-${location}`;
  const points = useRMemoRT(() => {
    // pseudo random from seed
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
    const rand = () => { h = (h * 9301 + 49297) % 233280; return h / 233280; };
    const segCount = 12 + Math.floor(distance / 4);
    const pts = [];
    let x = 40, y = 240;
    pts.push([x, y]);
    for (let i = 0; i < segCount; i++) {
      const angle = rand() * Math.PI * 2;
      const step = 28 + rand() * 32;
      x = Math.max(40, Math.min(320, x + Math.cos(angle) * step));
      y = Math.max(40, Math.min(280, y + Math.sin(angle) * step));
      pts.push([x, y]);
    }
    return pts;
  }, [seed]);

  const pathD = useRMemoRT(() => {
    // smooth path using quadratic curves
    if (!points.length) return "";
    let d = `M${points[0][0]},${points[0][1]}`;
    for (let i = 1; i < points.length; i++) {
      const [x1, y1] = points[i - 1];
      const [x2, y2] = points[i];
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      d += ` Q${x1},${y1} ${cx},${cy}`;
    }
    const last = points[points.length - 1];
    d += ` T${last[0]},${last[1]}`;
    return d;
  }, [points]);

  const start = points[0];
  const end = points[points.length - 1];
  const midPOIs = useRMemoRT(() => {
    if (points.length < 6) return [];
    const idxs = [Math.floor(points.length * 0.3), Math.floor(points.length * 0.62)];
    return idxs.map((i, k) => ({ pt: points[i], label: k === 0 ? "Mirador" : "Fuente", icon: k === 0 ? "mountain" : "weather" }));
  }, [points]);

  const I = window.Icon;
  const totalLen = 4200;

  return (
    <div className="map-bg" style={{ height: 280, position: 'relative' }}>
      {/* grid */}
      <svg viewBox="0 0 360 320" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}>
        <defs>
          <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="1"/>
          </pattern>
          <linearGradient id="routeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="#FF4D1A"/>
            <stop offset="100%" stopColor="#FFB31A"/>
          </linearGradient>
          <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect width="360" height="320" fill="url(#grid)"/>

        {/* contour lines (terrain) */}
        <g opacity="0.18" fill="none" stroke="#C6FF3D" strokeWidth="0.6">
          <ellipse cx="240" cy="120" rx="80" ry="50"/>
          <ellipse cx="240" cy="120" rx="55" ry="34"/>
          <ellipse cx="240" cy="120" rx="32" ry="20"/>
          <ellipse cx="80" cy="220" rx="60" ry="40"/>
          <ellipse cx="80" cy="220" rx="38" ry="24"/>
        </g>

        {/* shadow path */}
        <path d={pathD} fill="none" stroke="rgba(255,77,26,0.25)" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round"/>
        {/* main path */}
        <path d={pathD} fill="none" stroke="url(#routeGrad)" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"
          filter="url(#glow)"
          strokeDasharray={animated ? totalLen : undefined}
          strokeDashoffset={animated ? totalLen : 0}
          style={animated ? { animation: 'drawLine 2.2s cubic-bezier(.4,0,.2,1) forwards' } : undefined}/>

        {/* dashed direction indicator */}
        <path d={pathD} fill="none" stroke="rgba(255,255,255,0.7)" strokeWidth="0.8" strokeDasharray="3 6" opacity="0.5"/>

        {/* Start point */}
        <g transform={`translate(${start[0]},${start[1]})`}>
          <circle r="10" fill="rgba(198,255,61,0.2)"/>
          <circle r="6" fill="#C6FF3D"/>
          <circle r="3" fill="#0A0507"/>
        </g>
        {/* End point — pulsing */}
        <g transform={`translate(${end[0]},${end[1]})`}>
          <circle r="14" fill="rgba(255,77,26,0.25)">
            <animate attributeName="r" values="10;18;10" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
          </circle>
          <circle r="7" fill="#FF4D1A"/>
          <path d="M-2,-3 L3,0 L-2,3 Z" fill="#0A0507"/>
        </g>

        {/* POIs */}
        {midPOIs.map((p, i) => (
          <g key={i} transform={`translate(${p.pt[0]},${p.pt[1]})`}>
            <circle r="9" fill="#14171C" stroke="#FFB31A" strokeWidth="1.5"/>
            <circle r="2.5" fill="#FFB31A"/>
          </g>
        ))}
      </svg>

      {/* labels overlay */}
      <div style={{ position: 'absolute', top: 12, left: 12, display: 'flex', gap: 6, maxWidth: 'calc(100% - 90px)' }}>
        <span className="kbd" style={{ background: 'rgba(0,0,0,0.5)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: '100%' }}>
          <I name="location" size={10}/> <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{location}</span>
        </span>
      </div>
      <div style={{ position: 'absolute', top: 12, right: 12, display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'flex-end' }}>
        <button style={{
          width: 32, height: 32, borderRadius: 10,
          background: 'rgba(0,0,0,0.5)', border: '1px solid var(--line)',
          color: 'var(--text)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
        }}><I name="plus" size={14}/></button>
        <button style={{
          width: 32, height: 32, borderRadius: 10,
          background: 'rgba(0,0,0,0.5)', border: '1px solid var(--line)',
          color: 'var(--text)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
        }}><I name="minus" size={14}/></button>
      </div>

      {/* legend pill */}
      <div style={{ position: 'absolute', bottom: 12, left: 12, display: 'flex', gap: 6 }}>
        <span className="kbd" style={{ background: 'rgba(0,0,0,0.5)' }}>
          <span style={{ width: 8, height: 8, borderRadius: 99, background: '#C6FF3D' }}/>Inicio
        </span>
        <span className="kbd" style={{ background: 'rgba(0,0,0,0.5)' }}>
          <span style={{ width: 8, height: 8, borderRadius: 99, background: '#FF4D1A' }}/>Meta
        </span>
      </div>
    </div>
  );
}

  const [difficulty, setDifficulty] = useRStateRT(profile?.level === 'rookie' ? 'facil' : profile?.level === 'pro' ? 'duro' : 'medio');
  const [location, setLocation] = useRStateRT(profile?.city || window.AKK_DATA?.user?.location || 'Tu ubicación');
  const [generating, setGenerating] = useRStateRT(false);
  const [generated, setGenerated] = useRStateRT(true);
  const [routeKey, setRouteKey] = useRStateRT(0);
  const [gpsState, setGpsState] = useRStateRT('idle'); // idle | locating | ok | error
  const [weather, setWeather] = useRStateRT(null);
  const [coords, setCoords] = useRStateRT(null); // {lat,lng}
  const [manualOpen, setManualOpen] = useRStateRT(false);
  const [manualQuery, setManualQuery] = useRStateRT('');
  const [results, setResults] = useRStateRT([]);
  const [searching, setSearching] = useRStateRT(false);
  const [mapOpen, setMapOpen] = useRStateRT(false);

  // Preload cached location/weather
  React.useEffect(() => {
    if (!window.AKK_TOOLS) return;
    if (profile?.cityCoords) {
      // Use onboarding-provided coords
      (async () => {
        try {
          const w = await window.AKK_TOOLS.getWeather(profile.cityCoords.lat, profile.cityCoords.lng);
          setWeather(w);
          setCoords(profile.cityCoords);
          if (profile.city) setLocation(profile.city);
        } catch (e) {}
      })();
    } else {
      // Use location saved from GPS on sign-in/sign-up
      const u = window.AKK_DATA?.user;
      if (u?.locationLat && u?.locationLng) {
        (async () => {
          try {
            const w = await window.AKK_TOOLS.getWeather(u.locationLat, u.locationLng);
            setWeather(w);
            setCoords({ lat: u.locationLat, lng: u.locationLng });
            if (u.location) setLocation(u.location);
          } catch (e) {}
        })();
      } else {
        window.AKK_TOOLS.getLocationAndWeather().then(ctx => {
          if (ctx?.geo?.label) setLocation(ctx.geo.label);
          if (ctx?.weather) setWeather(ctx.weather);
          if (ctx?.pos) setCoords(ctx.pos);
          if (ctx?.real) setGpsState('ok');
        }).catch(() => {});
      }
    }
  }, [profile?.cityCoords?.lat]);

  // Debounced address search
  React.useEffect(() => {
    if (!manualQuery.trim() || manualQuery.trim().length < 3) { setResults([]); return; }
    setSearching(true);
    const t = setTimeout(async () => {
      try {
        const res = await window.AKK_TOOLS.forwardGeocode(manualQuery);
        setResults(res);
      } catch (e) {
        setResults([]);
      } finally {
        setSearching(false);
      }
    }, 380);
    return () => clearTimeout(t);
  }, [manualQuery]);

  async function pickResult(r) {
    setLocation(r.label);
    setCoords({ lat: r.lat, lng: r.lng });
    setManualOpen(false);
    setManualQuery('');
    setResults([]);
    setGpsState('manual');
    // Fetch weather for picked location
    try {
      const w = await window.AKK_TOOLS.getWeather(r.lat, r.lng);
      setWeather(w);
    } catch (e) {}
    // Regenerate route around this location
    setRouteKey(k => k + 1);
  }

  async function requestGPS() {
    setGpsState('locating');
    try {
      window.AKK_TOOLS.clearCache();
      const ctx = await window.AKK_TOOLS.getLocationAndWeather();
      if (ctx?.geo?.label) setLocation(ctx.geo.label);
      if (ctx?.weather) setWeather(ctx.weather);
      if (ctx?.pos) setCoords(ctx.pos);
      setGpsState(ctx.real ? 'ok' : 'error');
    } catch (e) {
      setGpsState('error');
    }
  }

  const activities = [
    { id: 'run', label: 'Running', icon: 'run' },
    { id: 'bike', label: 'Ciclismo', icon: 'bike' },
    { id: 'trail', label: 'Trail', icon: 'trail' },
    { id: 'mtb', label: 'MTB', icon: 'mtb' },
  ];

  const difficulties = [
    { id: 'facil', label: 'Fácil', color: '#C6FF3D' },
    { id: 'medio', label: 'Medio', color: '#FFB31A' },
    { id: 'duro', label: 'Duro', color: '#FF4D1A' },
    { id: 'pro', label: 'Pro', color: '#E66BFF' },
  ];

  // Generated metrics
  const speedMap = { run: 11, bike: 22, trail: 9, mtb: 14 }; // km/h
  const diffMult = { facil: 0.85, medio: 1, duro: 1.18, pro: 1.4 };
  const elevPerKm = { facil: 8, medio: 18, duro: 32, pro: 55 };

  const time = Math.round((distance / speedMap[activity]) * diffMult[difficulty] * 60); // mins
  const elevation = Math.round(distance * elevPerKm[difficulty] * (activity === 'trail' || activity === 'mtb' ? 1.35 : 1));
  const xpReward = Math.round(distance * 30 * diffMult[difficulty]);
  const kcal = Math.round(distance * 70 * (activity === 'run' ? 1.1 : activity === 'trail' ? 1.2 : 0.65));

  function fmtTime(m) {
    const h = Math.floor(m / 60), mm = m % 60;
    return h ? `${h}h ${mm}m` : `${mm}m`;
  }

  function generate() {
    setGenerating(true);
    setGenerated(false);
    setTimeout(() => {
      setGenerating(false);
      setGenerated(true);
      setRouteKey(k => k + 1);
    }, 900);
  }

  return (
    <div className="screen screen-in">
      <ScreenHeaderInline title="Rutas" sub="GENERADOR" />

      <div style={{ padding: '0 20px' }}>
        {/* Location */}
        <div className="card" style={{ padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{
            width: 36, height: 36, borderRadius: 10,
            background: 'rgba(255,77,26,0.12)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: 'var(--orange-bright)'
          }}>
            <I name="location" size={18}/>
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="label" style={{ fontSize: 10 }}>Punto de salida</div>
            <div style={{ fontWeight: 700, fontSize: 14, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{location}</div>
          </div>
          <button onClick={requestGPS} className={`btn-chip ${gpsState === 'ok' ? 'is-active-green' : 'is-active'}`} style={{ height: 32 }}>
            {gpsState === 'locating' ? (
              <span style={{ width: 10, height: 10, borderRadius: '50%', border: '2px solid currentColor', borderTopColor: 'transparent', animation: 'ringRotate 700ms linear infinite' }}/>
            ) : (
              <I name="target" size={12}/>
            )}
            {gpsState === 'ok' ? 'GPS · ON' : gpsState === 'manual' ? 'MANUAL' : gpsState === 'locating' ? 'Buscando…' : 'GPS'}
          </button>
        </div>

        {/* Manual address toggle + search */}
        <div style={{ marginTop: 8 }}>
          {!manualOpen ? (
            <button onClick={() => setManualOpen(true)} className="btn" style={{
              width: '100%', padding: '10px 14px',
              background: 'transparent', border: '1px dashed var(--line-strong)',
              borderRadius: 12, color: 'var(--text-dim)',
              fontSize: 13, fontWeight: 600, gap: 8,
            }}>
              <I name="search" size={14} color="var(--text-dim)"/>
              Introducir dirección manualmente
            </button>
          ) : (
            <div className="card" style={{ padding: 12, animation: 'screenIn 220ms cubic-bezier(.2,.9,.3,1)' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 6px' }}>
                <I name="search" size={16} color="var(--text-dim)"/>
                <input
                  autoFocus
                  value={manualQuery}
                  onChange={e => setManualQuery(e.target.value)}
                  placeholder="Ej. Parque del Retiro, Madrid"
                  style={{
                    flex: 1, background: 'transparent', border: 0, outline: 'none',
                    color: 'var(--text)', fontFamily: 'var(--body)', fontSize: 14, fontWeight: 600,
                    minWidth: 0, padding: '10px 0',
                  }}
                />
                {searching && (
                  <span style={{ width: 14, height: 14, borderRadius: '50%', border: '2px solid var(--text-faint)', borderTopColor: 'var(--orange-bright)', animation: 'ringRotate 700ms linear infinite' }}/>
                )}
                <button onClick={() => { setManualOpen(false); setManualQuery(''); setResults([]); }} style={{
                  width: 28, height: 28, borderRadius: 8, border: 0,
                  background: 'var(--surface-2)', color: 'var(--text-dim)',
                  cursor: 'pointer', fontSize: 14, lineHeight: 1,
                }}>×</button>
              </div>

              {/* Results dropdown */}
              {results.length > 0 && (
                <div style={{ marginTop: 8, borderTop: '1px solid var(--line)', paddingTop: 6 }}>
                  {results.map((r, i) => (
                    <button key={i} onClick={() => pickResult(r)} style={{
                      width: '100%', textAlign: 'left',
                      display: 'flex', alignItems: 'center', gap: 10,
                      padding: '10px 6px', border: 0, background: 'transparent',
                      color: 'var(--text)', cursor: 'pointer',
                      borderRadius: 8,
                      transition: 'background 120ms',
                    }} onMouseOver={e => e.currentTarget.style.background = 'var(--surface-2)'}
                       onMouseOut={e => e.currentTarget.style.background = 'transparent'}>
                      <I name="location" size={14} color="var(--orange-bright)"/>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontSize: 13, fontWeight: 700, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.label}</div>
                        <div style={{ fontSize: 10, color: 'var(--text-dim)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.full}</div>
                      </div>
                      <I name="chevron-right" size={14} color="var(--text-faint)"/>
                    </button>
                  ))}
                </div>
              )}
              {!searching && manualQuery.trim().length >= 3 && results.length === 0 && (
                <div style={{ marginTop: 8, padding: '8px 6px', fontSize: 12, color: 'var(--text-dim)', textAlign: 'center' }}>
                  Sin resultados. Prueba con otra dirección.
                </div>
              )}
              <div style={{ marginTop: 8, fontSize: 10, color: 'var(--text-faint)', padding: '0 6px', display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--green-bright)' }} className="pulse-dot"/>
                Geocoding por OpenStreetMap Nominatim
              </div>
            </div>
          )}
        </div>

        {/* Real weather chip */}
        {weather?.current && (
          <div style={{ marginTop: 10, display: 'flex', alignItems: 'center', gap: 10, padding: '10px 14px', background: 'var(--surface)', border: '1px solid var(--line)', borderRadius: 12 }}>
            <span style={{ fontSize: 22 }}>{window.AKK_TOOLS.weatherIcon(weather.current.weather_code, weather.current.is_day)}</span>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 12, fontWeight: 700 }}>
                {Math.round(weather.current.temperature_2m)}°C · {window.AKK_TOOLS.describeWMO(weather.current.weather_code)}
              </div>
              <div style={{ fontSize: 10, color: 'var(--text-dim)', marginTop: 1 }}>
                Viento {Math.round(weather.current.wind_speed_10m)} km/h · Hum {Math.round(weather.current.relative_humidity_2m)}%
              </div>
            </div>
            {(() => {
              const cond = window.AKK_TOOLS.runningCondition(weather);
              return (
                <div style={{ textAlign: 'right', flexShrink: 0 }}>
                  <div className="label" style={{ fontSize: 9 }}>PARA CORRER</div>
                  <div style={{ fontWeight: 700, fontSize: 12, color: cond.color }}>{cond.label}</div>
                </div>
              );
            })()}
          </div>
        )}

        {/* Activity type */}
        <div style={{ marginTop: 18 }}>
          <div className="label" style={{ marginBottom: 10 }}>Tipo de actividad</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            {activities.map(a => {
              const isActive = activity === a.id;
              return (
                <button key={a.id} onClick={() => setActivity(a.id)}
                  className="btn"
                  style={{
                    flexDirection: 'column', gap: 6, padding: '14px 6px',
                    background: isActive ? 'rgba(255,77,26,0.12)' : 'var(--surface)',
                    border: `1px solid ${isActive ? 'rgba(255,77,26,0.5)' : 'var(--line)'}`,
                    borderRadius: 14,
                    color: isActive ? 'var(--orange-bright)' : 'var(--text-dim)',
                  }}>
                  <I name={a.icon} size={22}/>
                  <span style={{ fontSize: 11, fontWeight: 700 }}>{a.label}</span>
                </button>
              );
            })}
          </div>
        </div>

        {/* Distance slider */}
        <div style={{ marginTop: 18 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
            <div className="label">Distancia objetivo</div>
            <div>
              <span className="metric" style={{ fontSize: 24, color: 'var(--orange-bright)' }}>{distance}</span>
              <span style={{ fontSize: 11, color: 'var(--text-dim)', marginLeft: 4 }}>km</span>
            </div>
          </div>
          <input type="range" min="2" max="50" value={distance} step="1"
            onChange={e => setDistance(parseInt(e.target.value))}
            style={{
              width: '100%', accentColor: 'var(--orange)',
              height: 24,
            }}/>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text-faint)', marginTop: 4 }}>
            <span>2 km</span><span>10</span><span>25</span><span>50 km</span>
          </div>
        </div>

        {/* Difficulty */}
        <div style={{ marginTop: 18 }}>
          <div className="label" style={{ marginBottom: 10 }}>Dificultad</div>
          <div style={{ display: 'flex', gap: 8 }}>
            {difficulties.map(d => {
              const isActive = difficulty === d.id;
              return (
                <button key={d.id} onClick={() => setDifficulty(d.id)}
                  className="btn"
                  style={{
                    flex: 1, height: 44, borderRadius: 12,
                    background: isActive ? `${d.color}1F` : 'var(--surface)',
                    border: `1px solid ${isActive ? d.color + '88' : 'var(--line)'}`,
                    color: isActive ? d.color : 'var(--text-dim)',
                    fontWeight: 700, fontSize: 13,
                  }}>
                  {d.label}
                </button>
              );
            })}
          </div>
        </div>

        {/* Generate button */}
        <button onClick={generate} className="btn btn-primary" style={{ width: '100%', marginTop: 20 }}>
          <I name="bolt" size={16} color="#0A0507"/>
          {generating ? 'Calculando ruta…' : 'Regenerar ruta'}
        </button>
      </div>

      {/* Generated route */}
      {(generating || generated) && (
        <div style={{ padding: '20px 20px 0' }}>
          <SectionHead title="Tu ruta" right={
            <span className="kbd"><I name="bolt" size={10} color="var(--green-bright)"/> AI</span>
          }/>
          <div className="card" style={{ padding: 0, overflow: 'hidden', opacity: generating ? 0.5 : 1, transition: 'opacity 200ms' }}>
            <div style={{ position: 'relative' }}>
              <RouteMap key={routeKey} activity={activity} distance={distance} difficulty={difficulty} animated={true} location={location}/>
              {generating && (
                <div style={{
                  position: 'absolute', inset: 0,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  background: 'rgba(8,9,11,0.6)', backdropFilter: 'blur(2px)',
                }}>
                  <div style={{ textAlign: 'center' }}>
                    <div style={{
                      width: 40, height: 40, borderRadius: '50%',
                      border: '3px solid rgba(255,77,26,0.2)', borderTopColor: 'var(--orange)',
                      animation: 'ringRotate 800ms linear infinite',
                      margin: '0 auto 12px',
                    }}/>
                    <div className="label" style={{ color: 'var(--orange-bright)' }}>Generando…</div>
                  </div>
                </div>
              )}
            </div>
            <div style={{ padding: 18 }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 14, gap: 12 }}>
                <div style={{ minWidth: 0, flex: 1 }}>
                  <div className="label" style={{ marginBottom: 4 }}>RUTA GENERADA</div>
                  <div className="h-display" style={{ fontSize: 22, color: 'var(--text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{location} Loop</div>
                </div>
                <div className="kbd" style={{ color: 'var(--green-bright)', background: 'var(--green-soft)', borderColor: 'rgba(198,255,61,0.3)', flexShrink: 0 }}>
                  +{xpReward} XP
                </div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
                <RouteMetric icon="route" label="Distancia" value={distance} unit="km"/>
                <RouteMetric icon="clock" label="Tiempo" value={fmtTime(time)} unit=""/>
                <RouteMetric icon="elev" label="Desnivel" value={`+${elevation}`} unit="m"/>
                <RouteMetric icon="kcal" label="Kcal" value={kcal} unit=""/>
              </div>

              {/* Elevation profile */}
              <div style={{ marginTop: 16 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                  <div className="label" style={{ fontSize: 10 }}>Perfil de elevación</div>
                  <div className="mono" style={{ fontSize: 10, color: 'var(--text-dim)' }}>máx {Math.round(elevation * 1.5)}m</div>
                </div>
                <ElevationProfile key={routeKey} difficulty={difficulty}/>
              </div>

              {/* POIs */}
              <div style={{ marginTop: 16 }}>
                <div className="label" style={{ fontSize: 10, marginBottom: 8 }}>Puntos de interés</div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  <POIChip icon="mountain" label="Mirador" color="#FFB31A"/>
                  <POIChip icon="weather" label="Fuente" color="#5DC9F2"/>
                  <POIChip icon="trophy" label="Segmento PR" color="#C6FF3D"/>
                </div>
              </div>

              <button onClick={() => setMapOpen(true)} className="btn btn-primary" style={{ width: '100%', marginTop: 18, background: 'var(--green)', boxShadow: 'var(--shadow-glow-green)' }}>
                <I name="play" size={16} color="#0A0507"/>
                Empezar ahora
              </button>

              {onAskAI && (
                <div style={{ marginTop: 12 }}>
                  <window.AIInlineLauncher
                    onClick={() => onAskAI([
                      { role: 'assistant', content: `Estás generando una ruta de ${distance} km · ${activity} · dificultad ${difficulty} desde ${location}. ¿Quieres consejos sobre ritmo, hidratación o si las condiciones son buenas?` },
                    ])}
                    label="¿Es buen día para esta ruta?"
                  />
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      <LiveMapView open={mapOpen} onClose={() => setMapOpen(false)}
        coords={coords} location={location} distance={distance} activity={activity}
        time={time} elevation={elevation} xp={xpReward} kcal={kcal}/>
    </div>
  );
}

function LiveMapView({ open, onClose, coords, location, distance, activity, time, elevation, xp, kcal }) {
  const I = window.Icon;
  const [tracking, setTracking] = React.useState(false);
  const [seconds, setSeconds] = React.useState(0);

  React.useEffect(() => {
    if (!tracking) return;
    const t = setInterval(() => setSeconds(s => s + 1), 1000);
    return () => clearInterval(t);
  }, [tracking]);

  function fmt(s) {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return (h ? `${String(h).padStart(2,'0')}:` : '') + `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  }

  if (!open) return null;

  const lat = coords?.lat || 40.4153;
  const lng = coords?.lng || -3.6843;
  const delta = 0.012;
  // OpenStreetMap embed — free, no key, no watermark, real streets+names
  const osmUrl = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-delta}%2C${lat-delta}%2C${lng+delta}%2C${lat+delta}&layer=mapnik&marker=${lat}%2C${lng}`;
  // External Google Maps — directions from current location to the route point, walking/biking
  const travelMode = (activity === 'bike' || activity === 'mtb') ? 'bicycling' : 'walking';
  const gmapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${lat}%2C${lng}&travelmode=${travelMode}`;
  const gmapsViewUrl = `https://www.google.com/maps/search/?api=1&query=${lat}%2C${lng}`;
  const osmFullUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=15/${lat}/${lng}`;

  function openExternal(url) {
    try {
      const win = window.open(url, '_blank', 'noopener,noreferrer');
      if (!win || win.closed || typeof win.closed === 'undefined') {
        // Fallback if popup blocked: open via temporary <a> click (uses top-level browsing context)
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {
      window.location.href = url;
    }
  }

  const labelMap = { run: 'Running', bike: 'Ciclismo', trail: 'Trail', mtb: 'MTB' };

  return (
    <div style={{
      position: 'absolute', inset: 0, zIndex: 200,
      background: '#000',
      animation: 'sheetUp 280ms cubic-bezier(.2,.9,.3,1)',
      display: 'flex', flexDirection: 'column',
    }}>
      {/* Map iframe */}
      <div style={{ position: 'absolute', inset: 0 }}>
        <iframe
          src={osmUrl}
          style={{ width: '100%', height: '100%', border: 0, filter: 'invert(0.92) hue-rotate(180deg) saturate(0.7)' }}
          loading="lazy"
          referrerPolicy="no-referrer"
        />
      </div>

      {/* Top header */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, zIndex: 2,
        padding: '50px 16px 18px',
        background: 'linear-gradient(180deg, rgba(8,9,11,0.95), rgba(8,9,11,0.7) 60%, transparent)',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button onClick={onClose} style={{
            width: 40, height: 40, borderRadius: 12,
            background: 'rgba(20,23,28,0.9)', border: '1px solid var(--line)',
            color: 'var(--text)', cursor: 'pointer', flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, lineHeight: 1, paddingBottom: 2,
          }}>×</button>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="label" style={{ color: tracking ? 'var(--green-bright)' : 'var(--orange-bright)', marginBottom: 2 }}>
              {tracking ? '● EN RUTA' : 'RUTA LISTA'}
            </div>
            <div style={{ fontWeight: 800, fontSize: 16, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{location}</div>
          </div>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 4,
            padding: '6px 10px', borderRadius: 999,
            background: 'rgba(20,23,28,0.9)', border: '1px solid var(--line)',
            color: 'var(--text-dim)', fontSize: 11, fontWeight: 700,
          }}>
            <span style={{ color: 'var(--orange-bright)' }}>{labelMap[activity]}</span>
          </div>
        </div>
      </div>

      {/* Bottom panel */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 2,
        padding: '20px 16px 26px',
        background: 'linear-gradient(0deg, rgba(8,9,11,0.98), rgba(8,9,11,0.85) 80%, transparent)',
      }}>
        {/* Live stats while tracking */}
        {tracking && (
          <div style={{
            background: 'rgba(20,23,28,0.95)', border: '1px solid var(--line-strong)',
            borderRadius: 16, padding: 16, marginBottom: 12,

function ElevationProfile({ difficulty }) {
  const profile = useRMemoRT(() => {
    let h = 0;
    for (let i = 0; i < difficulty.length; i++) h = (h * 31 + difficulty.charCodeAt(i)) >>> 0;
    const rand = () => { h = (h * 9301 + 49297) % 233280; return h / 233280; };
    const peaks = { facil: 0.3, medio: 0.55, duro: 0.85, pro: 1 };
    const peak = peaks[difficulty];
    const pts = [];
    let y = 0.2;
    for (let i = 0; i <= 30; i++) {
      const t = i / 30;
      const curve = Math.sin(t * Math.PI) * peak;
      y = curve * 0.8 + (rand() - 0.5) * 0.2;
      pts.push([t * 320, 60 - Math.max(0, y) * 50]);
    }
    return pts;
  }, [difficulty]);

  const pathD = `M0,60 ${profile.map(p => `L${p[0]},${p[1]}`).join(' ')} L320,60 Z`;
  const lineD = `M${profile.map(p => `${p[0]},${p[1]}`).join(' L')}`;

  return (
    <svg viewBox="0 0 320 64" style={{ width: '100%', height: 56 }}>
      <defs>
        <linearGradient id="elevGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#FF4D1A" stopOpacity="0.4"/>
          <stop offset="100%" stopColor="#FF4D1A" stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={pathD} fill="url(#elevGrad)"/>
      <path d={lineD} fill="none" stroke="#FF6E3D" strokeWidth="2" strokeLinejoin="round"/>
    </svg>
  );
}

  );

  const email = user?.email || baseUser.handle;
  const registeredCity = profile?.city || window.AKK_DATA?.user?.location || '';
  const [currentLocation, setCurrentLocation] = useStateP(null); // overrides registered if set

  const [locError, setLocError] = useStateP(null);
  const cityLabel = currentLocation?.label || registeredCity;
  const u = isNewUser ? {
    ...baseUser, name: displayName, initials,
    level: 1, xp: 0, xpToNext: 200, streak: 0,
    totals: { km: 0, activities: 0, hours: 0, elevation: 0 },
  } : { ...baseUser, name: displayName, initials };
  const tier = D.tierForLevel(u.level);
  const allBadges = D.badges.map(b => isNewUser ? { ...b, unlocked: false } : b);
  const unlocked = allBadges.filter(b => b.unlocked).length;
  const [tab, setTab] = useStateP('logros');
  const [avatarUrl, setAvatarUrl] = useStateP(null);
  const fileInputRef = React.useRef(null);

  function onAvatarClick() {
    fileInputRef.current?.click();
  }

  function onAvatarFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = () => setAvatarUrl(reader.result);
    reader.readAsDataURL(file);
    // Reset so same file can be re-picked
    e.target.value = '';
  }

  function removeAvatar() {
    setAvatarUrl(null);
  }

  async function useGPS() {
    setLocating(true);
    setLocError(null);
    if (!navigator.geolocation) {
      setLocError('Tu navegador no soporta geolocalización');
      setLocating(false);
      return;
    }
    try {
      if (window.AKK_TOOLS) window.AKK_TOOLS.clearCache();
      const pos = await new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
          err => reject(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
      let label = `${pos.lat.toFixed(3)}, ${pos.lng.toFixed(3)}`;
      try {
        const geo = await window.AKK_TOOLS.reverseGeocode(pos.lat, pos.lng);
        label = geo.label || label;
      } catch (e) {}
      setCurrentLocation({ label, ...pos });
    } catch (err) {
      if (err && err.code === 1) setLocError('Permiso denegado · activa el GPS en los ajustes del navegador');
      else if (err && err.code === 2) setLocError('No se pudo determinar tu ubicación');
      else if (err && err.code === 3) setLocError('Tiempo agotado · intenta de nuevo');
      else setLocError('No se pudo obtener tu ubicación');
    } finally {
      setLocating(false);
    }

  <script type="text/babel">
// auth.jsx — Welcome / Sign in / Sign up
const { useState: useStateAuth } = React;

function AuthScreen({ onAuth }) {
  const I = window.Icon;
  const [view, setView] = useStateAuth('welcome'); // welcome | signin | signup
  const [email, setEmail] = useStateAuth('');
  const [pwd, setPwd] = useStateAuth('');
  const [name, setName] = useStateAuth('');
  const [loading, setLoading] = useStateAuth(false);
  const [googleLoading, setGoogleLoading] = useStateAuth(false);

  async function submit() {
    if (!email.trim() || !pwd) return;
    setLoading(true);
    try {
      const isSignin = view === 'signin';
      const displayName = (name.trim() || email.split('@')[0]).replace(/^./, c => c.toUpperCase());
      const body = isSignin
        ? { email: email.trim(), password: pwd }
        : { name: displayName, email: email.trim(), password: pwd };
      await window.AKK_BRIDGE._ready;
      const res = await fetch(window.AKK_BRIDGE.api + '/auth/' + (isSignin ? 'login' : 'register'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        alert(data.error || 'Error al conectar');
        setLoading(false);
        return;
      }
      await window.AKK_BRIDGE.afterAuth(data.token, data.user);
      onAuth({ name: data.user.name, email: data.user.email, skipOnboarding: isSignin || !!data.user.onboarded });
    } catch (e) {
      alert('No se pudo conectar. El servidor puede estar arrancando (plan gratuito).\n\nEspera 30 segundos y vuelve a intentarlo.');
    } finally {
      setLoading(false);
    }
  }

  function googleAuth() {
    setGoogleLoading(true);
    setTimeout(() => {
      setGoogleLoading(false);
      alert('Login con Google no disponible en modo local.\nUsa email y contraseña.');
    }, 300);
  }

  if (view === 'welcome') return <WelcomeView onSignIn={() => setView('signin')} onSignUp={() => setView('signup')} onGuest={() => onAuth({ name: 'Invitado', email: '' })} onGoogle={googleAuth} googleLoading={googleLoading}/>;

  const isSignup = view === 'signup';

  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: 'var(--bg)',
      padding: '54px 24px 24px',
      display: 'flex', flexDirection: 'column',
      overflowY: 'auto',
      animation: 'screenIn 280ms cubic-bezier(.2,.9,.3,1)',
    }}>
      {/* Back */}
      <button onClick={() => setView('welcome')} className="btn" style={{
        alignSelf: 'flex-start', marginTop: 8,
        width: 40, height: 40, borderRadius: 12,
        background: 'var(--surface)', border: '1px solid var(--line)',
        color: 'var(--text)', flexShrink: 0,
      }}>
        <I name="chevron-right" size={18} style={{ transform: 'rotate(180deg)' }}/>
      </button>

      {/* Header */}
      <div style={{ marginTop: 36 }}>
        <div className="label" style={{ color: 'var(--orange-bright)', marginBottom: 14 }}>{isSignup ? 'NUEVA CUENTA' : 'BIENVENIDO DE VUELTA'}</div>
        <h1 className="h-display" style={{ margin: 0, fontSize: 42, lineHeight: 0.95 }}>
          {isSignup ? <>Únete a la<br/><span style={{ color: 'var(--orange-bright)' }}>manada</span></> : <>Vuelve a la<br/><span style={{ color: 'var(--orange-bright)' }}>manada</span></>}
        </h1>
      </div>

      {/* Form */}
      <div style={{ marginTop: 36, display: 'flex', flexDirection: 'column', gap: 18 }}>
        {isSignup && (
          <Field label="Nombre" icon="user" value={name} onChange={setName} placeholder="Tu nombre"/>
        )}
        <Field label="Email" icon="weather" value={email} onChange={setEmail} placeholder="tu@email.com" type="email"/>
        <Field label="Contraseña" icon="bolt" value={pwd} onChange={setPwd} placeholder="••••••••" type="password"/>
        {!isSignup && (
          <div style={{ textAlign: 'right', marginTop: -6 }}>
            <a href="#" style={{ color: 'var(--text-dim)', fontSize: 12, fontWeight: 600, textDecoration: 'none' }}>¿Has olvidado tu contraseña?</a>
          </div>
        )}
      </div>

      {/* CTA */}
      <button onClick={submit} disabled={loading} className="btn btn-primary" style={{ width: '100%', marginTop: 32 }}>
        {loading ? (
          <span style={{
            width: 18, height: 18, borderRadius: '50%',
            border: '2px solid rgba(10,5,7,0.3)', borderTopColor: '#0A0507',
            animation: 'ringRotate 700ms linear infinite',
          }}/>
        ) : (
          <>
            <I name="bolt" size={14} color="#0A0507"/>
            {isSignup ? 'Crear cuenta' : 'Iniciar sesión'}
          </>
        )}
      </button>

      {/* Divider */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, margin: '28px 0 20px' }}>
        <div style={{ flex: 1, height: 1, background: 'var(--line)' }}/>
        <span className="label" style={{ fontSize: 10 }}>O CONTINÚA CON</span>
        <div style={{ flex: 1, height: 1, background: 'var(--line)' }}/>
      </div>

      <button onClick={googleAuth} disabled={googleLoading} className="btn" style={{
        width: '100%', height: 56, borderRadius: 16,
        background: '#fff', color: '#1F1F1F',
        fontSize: 15, fontWeight: 700,
        gap: 12,
      }}>
        {googleLoading ? (
          <span style={{
            width: 18, height: 18, borderRadius: '50%',
            border: '2px solid rgba(0,0,0,0.15)', borderTopColor: '#1F1F1F',
            animation: 'ringRotate 700ms linear infinite',
          }}/>
        ) : (
          <>
            <GoogleG/>
            Continuar con Google
          </>
        )}
      </button>

      {/* Footer */}
      <div style={{ marginTop: 28, marginBottom: 8, textAlign: 'center', fontSize: 13, color: 'var(--text-dim)' }}>
        {isSignup ? '¿Ya tienes cuenta?' : '¿Eres nuevo?'}{' '}
        <a onClick={() => setView(isSignup ? 'signin' : 'signup')} style={{ color: 'var(--orange-bright)', fontWeight: 700, cursor: 'pointer' }}>
          {isSignup ? 'Inicia sesión' : 'Crea una cuenta'}
        </a>
      </div>
    </div>
  );
}

function Field({ label, icon, value, onChange, placeholder, type = 'text' }) {
  const I = window.Icon;
  return (
    <div>
      <div className="label" style={{ fontSize: 10, marginBottom: 8 }}>{label}</div>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 10,

      }}>

        <input
          type={type}
          value={value}
          onChange={e => onChange(e.target.value)}
